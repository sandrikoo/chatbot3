<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }
    input[type="text"]:focus { border-color: #a78bfa; }

    button {
      padding: 14px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-fetch {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      white-space: nowrap;
    }
    .btn-fetch:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-fetch:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-download {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #059669, #0d9488);
      color: #fff;
      font-size: 1rem;
      border-radius: 14px;
      margin-top: 20px;
    }
    .btn-download:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-download:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #video-info { display: none; }

    .thumb-row {
      display: flex;
      gap: 16px;
      margin-bottom: 22px;
      align-items: flex-start;
    }

    .thumb-row img {
      width: 140px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .video-meta { flex: 1; }
    .video-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .video-sub {
      color: rgba(255,255,255,0.5);
      font-size: 0.82rem;
    }

    label.format-label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 0.88rem;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    select option { background: #302b63; color: #fff; }

    .error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar-wrap {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      margin-top: 14px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      border-radius: 99px;
      animation: progress-anim 1.4s ease-in-out infinite;
    }
    @keyframes progress-anim {
      0%   { width: 0%; margin-left: 0; }
      50%  { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .sites {
      margin-top: 28px;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 0.8rem;
    }
    .sites span {
      background: rgba(255,255,255,0.07);
      padding: 3px 10px;
      border-radius: 99px;
      margin: 3px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>&#9654; Media Downloader</h1>
  <p class="subtitle">Download videos &amp; music from YouTube, Twitter, TikTok, and more</p>

  <div id="error-box" class="error" style="display:none"></div>

  <div class="input-row">
    <input type="text" id="url-input" placeholder="Paste video URL here..." />
    <button class="btn-fetch" id="fetch-btn" onclick="fetchInfo()">Fetch</button>
  </div>

  <div id="video-info">
    <div class="thumb-row">
      <img id="thumbnail" src="" alt="thumbnail" />
      <div class="video-meta">
        <div class="video-title" id="video-title"></div>
        <div class="video-sub" id="video-sub"></div>
      </div>
    </div>

    <label class="format-label">Choose format &amp; quality</label>
    <select id="format-select"></select>

    <button class="btn-download" id="download-btn" onclick="startDownload()">
      &#8659; Download
    </button>
    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="sites">
    <p style="margin-bottom:6px">Supports 1000+ sites including</p>
    <span>YouTube</span><span>TikTok</span><span>Twitter / X</span>
    <span>Instagram</span><span>Facebook</span><span>Twitch</span>
    <span>Vimeo</span><span>Reddit</span><span>SoundCloud</span>
  </div>
</div>

<script>
  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function clearError() {
    document.getElementById('error-box').style.display = 'none';
  }

  function formatDuration(secs) {
    if (!secs) return '';
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes > 1e9) return ` · ~${(bytes/1e9).toFixed(1)} GB`;
    if (bytes > 1e6) return ` · ~${(bytes/1e6).toFixed(0)} MB`;
    return ` · ~${(bytes/1e3).toFixed(0)} KB`;
  }

  async function fetchInfo() {
    clearError();
    const url = document.getElementById('url-input').value.trim();
    if (!url) return showError('Please enter a URL');

    const btn = document.getElementById('fetch-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Fetching...';
    document.getElementById('video-info').style.display = 'none';

    try {
      const res = await fetch('/api/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Failed to fetch info');

      document.getElementById('thumbnail').src = data.thumbnail || '';
      document.getElementById('video-title').textContent = data.title || 'Unknown title';
      document.getElementById('video-sub').textContent =
        (data.uploader ? data.uploader : '') +
        (data.duration ? '  ·  ' + formatDuration(data.duration) : '');

      const sel = document.getElementById('format-select');
      sel.innerHTML = '';
      data.formats.forEach(f => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ id: f.id, type: f.type, ext: f.ext });
        opt.textContent = f.label + formatSize(f.filesize);
        sel.appendChild(opt);
      });

      document.getElementById('video-info').style.display = 'block';
    } catch (e) {
      showError('Network error. Is the server running?');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  }

  async function startDownload() {
    clearError();
    const url = document.getElementById('url-input').value.trim();
    const selVal = document.getElementById('format-select').value;
    if (!url || !selVal) return;

    const format = JSON.parse(selVal);
    const btn = document.getElementById('download-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Preparing download...';
    document.getElementById('progress-wrap').style.display = 'block';

    try {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, formatId: format.id, type: format.type, ext: format.ext })
      });

      if (!res.ok) {
        const data = await res.json();
        return showError(data.error || 'Download failed');
      }

      const blob = await res.blob();
      const ext = format.type === 'audio' ? 'mp3' : 'mp4';
      const title = document.getElementById('video-title').textContent.replace(/[^\w\s-]/g,'').trim() || 'download';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      showError('Download failed. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '&#8659; Download';
      document.getElementById('progress-wrap').style.display = 'none';
    }
  }

  // Allow pressing Enter in the URL input
  document.getElementById('url-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchInfo();
  });
</script>
</body>
</html>
